<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Porra Mundial 2026 — Cron</title>
</head>
<body>
  <p id="status">Ejecutando aviso diario...</p>
  <script type="module">
    import { triggerAvisoDiario } from './js/email.js';
    try {
      await triggerAvisoDiario();
      document.getElementById('status').textContent = 'OK: aviso diario ejecutado';
    } catch (e) {
      document.getElementById('status').textContent = 'ERROR: ' + e.message;
      console.error(e);
    }
  </script>
</body>
</html>
